name: Daily Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: Scan ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - kube-apiserver
          - kube-controller-manager
          - kube-scheduler
          - kube-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          [[ -f VERSION ]] || { echo "VERSION file missing"; exit 1; }
          TAG="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/oleksandr-minakov/control-repo-test-sonnet/${{ matrix.component }}:${TAG}" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "${{ steps.tag.outputs.image }}"

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft "${{ steps.tag.outputs.image }}" \
            -o cyclonedx-json \
            --file /tmp/daily-sbom-${{ matrix.component }}.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: daily-sbom-${{ matrix.component }}
          path: /tmp/daily-sbom-${{ matrix.component }}.cyclonedx.json
          retention-days: 30

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan with Grype
        run: |
          grype "${{ steps.tag.outputs.image }}" \
            -o sarif --file /tmp/daily-grype-${{ matrix.component }}.sarif || true

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        with:
          name: daily-grype-${{ matrix.component }}
          path: /tmp/daily-grype-${{ matrix.component }}.sarif
          retention-days: 30
